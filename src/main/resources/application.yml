server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: credit-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  # No custom swagger-ui.path here: setting it to the same value as the
  # real static resource (/swagger-ui/index.html) made springdoc redirect
  # to itself, landing on /swagger-ui/swagger-ui/index.html. The default
  # entrypoint (/swagger-ui.html -> forwards to /swagger-ui/index.html)
  # already works correctly without any override.

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-dev-only-change-this-secret}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  demo-user:
    username: ${DEMO_USER_USERNAME:demo}
    password-hash: ${DEMO_USER_PASSWORD_HASH:}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
    client-email: ${FIREBASE_CLIENT_EMAIL:}
    private-key: ${FIREBASE_PRIVATE_KEY:}
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  mailgun:
    api-key: ${MAILGUN_API_KEY:}
    domain: ${MAILGUN_DOMAIN:}
    base-url: ${MAILGUN_BASE_URL:https://api.mailgun.net/v3}
    from-email: ${MAILGUN_FROM_EMAIL:}
    from-name: ${MAILGUN_FROM_NAME:Fya Social Capital}
    notification-email: ${CREDIT_NOTIFICATION_EMAIL:fyasocialcapital@gmail.com}
  rate-limit:
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:5}
    create-credit-per-minute: ${RATE_LIMIT_CREATE_CREDIT_PER_MINUTE:20}
    list-credit-per-minute: ${RATE_LIMIT_LIST_CREDITS_PER_MINUTE:60}
  email:
    worker:
      enabled: ${EMAIL_WORKER_ENABLED:false}
      fixed-delay-ms: ${EMAIL_WORKER_FIXED_DELAY_MS:10000}
      batch-size: ${EMAIL_WORKER_BATCH_SIZE:10}
      max-attempts: ${EMAIL_WORKER_MAX_ATTEMPTS:3}
