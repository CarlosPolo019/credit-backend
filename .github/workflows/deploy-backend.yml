name: Deploy Backend

# Manual only: trigger from GitHub -> Actions -> Deploy Backend -> Run workflow.
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render deploy
        # `secrets` isn't a valid context inside a step `if:` — pull it into
        # `env` first (same bug that kept credit-web's deploy from ever
        # running: "Unrecognized named-value: 'secrets'").
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
