name: Keep Backend Alive

# Render's free tier spins down the service after ~15 minutes of inactivity,
# and the first request after that can take 50s+ while it cold-starts. This
# pings the health endpoint often enough that it never goes idle.
on:
  schedule:
    # Offset off the exact 5-minute marks (:00/:05/:10...) — that's when
    # GitHub's scheduler is busiest across every repo, so on-the-mark crons
    # get delayed or dropped more often.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://fyatest-api.cmescorcia.com/actuator/health)
          echo "Health check responded with $status"
          if [ "$status" -ge 500 ]; then
            exit 1
          fi
